<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الثعبان - OSAMA STORE</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .score-board {
            font-size: 20px;
            margin-bottom: 15px;
            background: #1e1e1e;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        canvas {
            background-color: #000;
            border: 4px solid #00ffcc;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            display: block;
            margin: 0 auto;
        }
        .footer {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>🐍 Snake Game 🐍</h1>
    <p class="footer">تصميم وبرمجة: أسامة</p>

    <div class="score-board">
        النقاط: <span id="score">0</span> | أعلى نقاط: <span id="high-score">0</span>
    </div>

    <div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- ربط ملف الجافاسكريبت للعبة -->
    <script src="script.js"></script>
</body>
</html>
