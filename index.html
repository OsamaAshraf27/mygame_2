<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ألعاب أسامة - Osama Games Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .games-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .game-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            width: 280px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
        }
        .game-card h3 {
            color: #00ffcc;
            margin-bottom: 10px;
        }
        .game-card p {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .play-btn {
            background-color: #00ffcc;
            color: #121212;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .play-btn:hover {
            background-color: #00cca3;
        }
    </style>
</head>
<body>

    <h1>🎮 منصة ألعاب أسامة</h1>
    <p class="subtitle">موقعك المفضل للاستمتاع بأفضل الألعاب الخفيفة والممتعة</p>

    <div class="games-container">
        <!-- كرت لعبة الثعبان -->
        <div class="game-card">
            <h3>🐍 لعبة الثعبان (Snake)</h3>
            <p>لعبة الأركيد الكلاسيكية الشهيرة، اجمع النقاط وتجنب الاصطدام!</p>
            <a href="snake.html" class="play-btn">العب الآن</a>
        </div>
    </div>

</body>
</html>
