<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X-O - منصة ألعاب أسامة</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 10px;
        }
        .status {
            font-size: 22px;
            margin-bottom: 20px;
            color: #ff007f;
            font-weight: bold;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .cell {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cell:hover {
            border-color: #00ffcc;
            background-color: #2a2a2a;
        }
        .cell.x {
            color: #00ffcc;
        }
        .cell.o {
            color: #ff007f;
        }
        .reset-btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .reset-btn:hover {
            background-color: #00cca3;
        }
        .back-btn {
            display: inline-block;
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>❌ لعبة X - O ⭕</h1>
    <div class="status" id="status">دور اللاعب: X</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">إعادة اللعب 🔄</button>
    <br>
    <a href="index.html" class="back-btn">⬅ العودة للقائمة الرئيسية</a>

    <script src="xo.js"></script>
</body>
</html>
